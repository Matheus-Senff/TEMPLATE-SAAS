<!doctype html>
<html lang="pt-BR">
  <body style="margin: 0; background: #f5f5f5; font-family: Arial, sans-serif; color: #111">
    <table width="100%" cellpadding="0" cellspacing="0">
      <tr>
        <td align="center" style="padding: 24px">
          <table
            width="560"
            cellpadding="0"
            cellspacing="0"
            style="background: #fff; border-radius: 8px; padding: 32px"
          >
            <tr>
              <td>
                <h1 style="font-size: 20px; margin: 0 0 16px">Você foi convidado</h1>
                <p style="line-height: 1.5; margin: 0 0 24px">
                  Você recebeu um convite para acessar a plataforma. Clique para aceitar e definir sua senha.
                </p>
                <p style="margin: 0 0 24px">
                  <a
                    href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=invite&next=/redefinir-senha"
                    style="
                      background: #111;
                      color: #fff;
                      padding: 12px 20px;
                      border-radius: 6px;
                      text-decoration: none;
                      display: inline-block;
                    "
                    >Aceitar convite</a
                  >
                </p>
                <p style="font-size: 12px; color: #666; margin: 0">Se você não fez este pedido, ignore este e-mail.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
